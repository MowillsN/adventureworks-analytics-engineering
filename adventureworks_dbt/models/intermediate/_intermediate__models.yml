version: 2

models:
  - name: int_product_denormalized
    description: >
      Denormalizes the product dimension by joining in subcategory and
      category attributes. Uses left joins throughout to preserve all
      products, including the ~209 products with no subcategory assignment.
      Feeds directly into the dim_product mart.
    columns:
      - name: product_key
        description: "Surrogate key uniquely identifying a product record."
      - name: product_alternate_key
        description: "Natural/business key for the product from the source system."
      - name: product_name
        description: "English product name."
      - name: standard_cost
        description: "Standard cost to produce/acquire the product."
      - name: list_price
        description: "Standard list/retail price."
      - name: dealer_price
        description: "Wholesale/dealer price."
      - name: color
        description: "Product color."
      - name: size
        description: "Product size."
      - name: size_range
        description: "Descriptive size range (e.g. '38-40 CM')."
      - name: weight
        description: "Product weight."
      - name: class
        description: "Product class (e.g. L, M, H for Low/Medium/High)."
      - name: style
        description: "Product style (e.g. Unisex, Men's, Women's)."
      - name: model_name
        description: "Product model name."
      - name: description
        description: "English product description."
      - name: product_line
        description: "Product line category."
      - name: finished_goods_flag
        description: "Flag indicating whether the product is a finished good."
      - name: start_date
        description: "Date this product record version became effective (SCD2)."
      - name: end_date
        description: "Date this product record version stopped being effective (SCD2). Null indicates the current/active version."
      - name: status
        description: "Product status (e.g. Current, Discontinued)."
      - name: product_subcategory_key
        description: "Foreign key to the product subcategory. Null for products without a subcategory."
      - name: product_subcategory_name
        description: "English subcategory name, joined in from dim_product_subcategory. Null where subcategory is not assigned."
      - name: product_category_key
        description: "Foreign key to the product category, resolved via subcategory. Null where subcategory is not assigned."
      - name: product_category_name
        description: "English category name, joined in via subcategory. Null where subcategory is not assigned."

  - name: int_sales_unioned
    description: >
      Unions internet and reseller sales into a single company-wide sales
      dataset, using only the conformed columns shared by both channels
      (per the bus matrix: date roles, product, promotion, sales territory).
      Channel-specific dimensions (customer, reseller, employee, sales
      reason) are intentionally excluded — those remain queryable only
      through the separate channel-specific fact marts. Adds a sales_channel
      column to distinguish the source of each row. Feeds directly into the
      fct_sales mart.
    columns:
      - name: sales_channel
        description: "Indicates the originating sales channel: 'Internet' or 'Reseller'."
      - name: product_key
        description: "Foreign key to the product dimension."
      - name: order_date_key
        description: "Foreign key to the date dimension, representing the order date."
      - name: due_date_key
        description: "Foreign key to the date dimension, representing the due date."
      - name: ship_date_key
        description: "Foreign key to the date dimension, representing the ship date."
      - name: promotion_key
        description: "Foreign key to the promotion dimension."
      - name: sales_territory_key
        description: "Foreign key to the sales territory dimension."
      - name: sales_order_number
        description: "Business sales order number."
      - name: sales_order_line_number
        description: "Line number within the sales order."
      - name: order_quantity
        description: "Quantity of the product ordered on this line."
      - name: unit_price
        description: "Unit price of the product at time of sale."
      - name: extended_amount
        description: "Unit price multiplied by order quantity, before discount."
      - name: unit_price_discount_pct
        description: "Discount percentage applied to the unit price."
      - name: discount_amount
        description: "Total discount amount applied to this line."
      - name: product_standard_cost
        description: "Standard cost of the product at time of sale."
      - name: total_product_cost
        description: "Total cost of the product for this line."
      - name: sales_amount
        description: "Final sales amount for this line, after discount. Core revenue measure."
      - name: tax_amount
        description: "Tax amount applied to this line."
      - name: freight
        description: "Freight/shipping cost for this line."
      - name: order_date
        description: "Date the order was placed."
      - name: due_date
        description: "Date the order is due."
      - name: ship_date
        description: "Date the order was shipped."
  - name: int_customer_enriched
    description: >
      Enriches the customer dimension with derived attributes: full_name
      (concatenated first + last name) and age banding calculated as of
      date_first_purchase (not current date) to keep historical reporting
      stable and reproducible across model rebuilds. Deliberately excludes
      some staging columns (customer_alternate_key, suffix, email_address,
      number_cars_owned, commute_distance) as they're out of scope for BI
      reporting. Feeds directly into the dim_customer mart.
    columns:
      - name: customer_key
        description: "Surrogate key uniquely identifying a customer."
      - name: geography_key
        description: "Foreign key to the geography dimension."
      - name: first_name
        description: "Customer's first name."
      - name: last_name
        description: "Customer's last name."
      - name: full_name
        description: "Derived: first_name and last_name concatenated with a space."
      - name: birth_date
        description: "Customer's date of birth."
      - name: marital_status
        description: "Customer's marital status."
      - name: gender
        description: "Customer's gender."
      - name: yearly_income
        description: "Customer's self-reported yearly income."
      - name: total_children
        description: "Total number of children the customer has."
      - name: number_children_at_home
        description: "Number of the customer's children currently living at home."
      - name: education
        description: "Customer's highest level of education completed."
      - name: occupation
        description: "Customer's occupation category."
      - name: house_owner_flag
        description: "Flag indicating whether the customer owns their home."
      - name: date_first_purchase
        description: "Date of the customer's first purchase. Used as the reference point for age calculations."
      - name: age_at_first_purchase
        description: "Derived: customer's age in years at the time of their first purchase, calculated as (date_first_purchase - birth_date) / 12 months. Fixed and stable — does not change on model rebuild."
      - name: age_band_at_first_purchase
        description: "Derived: age_at_first_purchase grouped into bands (18-24, 25-34, 35-44, 45-54, 55-64, 65+)."