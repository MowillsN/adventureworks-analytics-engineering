version: 2

models:
  # --- Dimensions ---

  - name: dim_customer
    description: >
      Customer dimension for the internet sales channel, enriched with
      full_name and age banding (as of first purchase). Sourced from
      int_customer_enriched. One row per customer. BI-facing, materialized
      as a table.
    columns:
      - name: customer_key
        description: "Surrogate key uniquely identifying a customer. Primary key of this table."
        tests:
          - unique
          - not_null
      - name: age_band_at_first_purchase
        description: "Customer's age band at the time of their first purchase."

  - name: dim_geography
    description: "Geography dimension. One row per unique city/state/country combination. BI-facing, materialized as a table."
    columns:
      - name: geography_key
        description: "Surrogate key uniquely identifying a geography record. Primary key of this table."
        tests:
          - unique
          - not_null

  - name: dim_product
    description: >
      Denormalized product dimension, including subcategory and category
      attributes flattened in for simpler BI querying. Sourced from
      int_product_denormalized. BI-facing, materialized as a table.
    columns:
      - name: product_key
        description: "Surrogate key uniquely identifying a product record. Primary key of this table."
        tests:
          - unique
          - not_null

  - name: dim_promotion
    description: "Promotion dimension, applicable to both internet and reseller sales. BI-facing, materialized as a table."
    columns:
      - name: promotion_key
        description: "Surrogate key uniquely identifying a promotion. Primary key of this table."
        tests:
          - unique
          - not_null

  - name: dim_sales_territory
    description: "Sales territory/region dimension. BI-facing, materialized as a table."
    columns:
      - name: sales_territory_key
        description: "Surrogate key uniquely identifying a sales territory. Primary key of this table."
        tests:
          - unique
          - not_null

  - name: dim_reseller
    description: "Reseller (B2B account) dimension for the reseller sales channel. BI-facing, materialized as a table."
    columns:
      - name: reseller_key
        description: "Surrogate key uniquely identifying a reseller. Primary key of this table."
        tests:
          - unique
          - not_null

  - name: dim_sales_reason
    description: "Sales reason dimension, internet-channel-only. BI-facing, materialized as a table."
    columns:
      - name: sales_reason_key
        description: "Surrogate key uniquely identifying a sales reason. Primary key of this table."
        tests:
          - unique
          - not_null

  - name: dim_date
    description: >
      Base date dimension. One row per calendar day. This is the single
      source of truth for date attributes; dim_order_date, dim_due_date,
      and dim_ship_date are role-playing views over this table, used to
      give Power BI three independent, filterable date relationships
      without needing DAX USERELATIONSHIP workarounds.
    columns:
      - name: date_key
        description: "Surrogate key for the date. Primary key of this table."
        tests:
          - unique
          - not_null

  - name: dim_order_date
    description: >
      Role-playing view of dim_date, representing the 'order date' role.
      Intended to be connected to the order_date_key column on fact tables
      in Power BI.
    columns:
      - name: date_key
        description: "Surrogate key for the date. Primary key of this table."
        tests:
          - unique
          - not_null

  - name: dim_due_date
    description: >
      Role-playing view of dim_date, representing the 'due date' role.
      Intended to be connected to the due_date_key column on fact tables
      in Power BI.
    columns:
      - name: date_key
        description: "Surrogate key for the date. Primary key of this table."
        tests:
          - unique
          - not_null

  - name: dim_ship_date
    description: >
      Role-playing view of dim_date, representing the 'ship date' role.
      Intended to be connected to the ship_date_key column on fact tables
      in Power BI.
    columns:
      - name: date_key
        description: "Surrogate key for the date. Primary key of this table."
        tests:
          - unique
          - not_null

  # --- Facts ---

  - name: fct_internet_sales
    description: >
      Internet (direct-to-consumer) sales fact table. Grain: one row per
      sales order line (sales_order_number + sales_order_line_number).
      Channel-specific to internet sales — includes customer_key, which
      reseller sales does not have.
    columns:
      - name: product_key
        description: "Foreign key to dim_product."
      - name: order_date_key
        description: "Foreign key to dim_order_date."
      - name: due_date_key
        description: "Foreign key to dim_due_date."
      - name: ship_date_key
        description: "Foreign key to dim_ship_date."
      - name: customer_key
        description: "Foreign key to dim_customer."
      - name: promotion_key
        description: "Foreign key to dim_promotion."
      - name: sales_territory_key
        description: "Foreign key to dim_sales_territory."
      - name: sales_order_number
        description: "Business sales order number. Part of the composite grain key."
      - name: sales_order_line_number
        description: "Line number within the sales order. Part of the composite grain key."
      - name: order_quantity
        description: "Quantity of the product ordered on this line."
      - name: unit_price
        description: "Unit price of the product at time of sale."
      - name: extended_amount
        description: "Unit price multiplied by order quantity, before discount."
      - name: unit_price_discount_pct
        description: "Discount percentage applied to the unit price."
      - name: discount_amount
        description: "Total discount amount applied to this line."
      - name: product_standard_cost
        description: "Standard cost of the product at time of sale."
      - name: total_product_cost
        description: "Total cost of the product for this line."
      - name: sales_amount
        description: "Final sales amount for this line, after discount. Core revenue measure."
      - name: tax_amount
        description: "Tax amount applied to this line."
      - name: freight
        description: "Freight/shipping cost for this line."
      - name: carrier_tracking_number
        description: "Always null for internet sales — not applicable to this channel."
      - name: customer_po_number
        description: "Always null for internet sales — not applicable to this channel."
      - name: order_date
        description: "Date the order was placed."
      - name: due_date
        description: "Date the order is due."
      - name: ship_date
        description: "Date the order was shipped."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - sales_order_number
              - sales_order_line_number

  - name: fct_reseller_sales
    description: >
      Reseller (B2B) sales fact table. Grain: one row per sales order line
      (sales_order_number + sales_order_line_number). Channel-specific to
      reseller sales — includes reseller_key and employee_key, which
      internet sales does not have.
    columns:
      - name: product_key
        description: "Foreign key to dim_product."
      - name: order_date_key
        description: "Foreign key to dim_order_date."
      - name: due_date_key
        description: "Foreign key to dim_due_date."
      - name: ship_date_key
        description: "Foreign key to dim_ship_date."
      - name: reseller_key
        description: "Foreign key to dim_reseller."
      - name: employee_key
        description: "Foreign key to the employee (sales rep) dimension. Out of scope for this project; retained for reference only."
      - name: promotion_key
        description: "Foreign key to dim_promotion."
      - name: sales_territory_key
        description: "Foreign key to dim_sales_territory."
      - name: sales_order_number
        description: "Business sales order number. Part of the composite grain key."
      - name: sales_order_line_number
        description: "Line number within the sales order. Part of the composite grain key."
      - name: order_quantity
        description: "Quantity of the product ordered on this line."
      - name: unit_price
        description: "Unit price of the product at time of sale."
      - name: extended_amount
        description: "Unit price multiplied by order quantity, before discount."
      - name: unit_price_discount_pct
        description: "Discount percentage applied to the unit price."
      - name: discount_amount
        description: "Total discount amount applied to this line."
      - name: product_standard_cost
        description: "Standard cost of the product at time of sale."
      - name: total_product_cost
        description: "Total cost of the product for this line."
      - name: sales_amount
        description: "Final sales amount for this line, after discount. Core revenue measure."
      - name: tax_amount
        description: "Tax amount applied to this line."
      - name: freight
        description: "Freight/shipping cost for this line."
      - name: carrier_tracking_number
        description: "Freight carrier tracking number for this shipment."
      - name: customer_po_number
        description: "Reseller's purchase order number."
      - name: order_date
        description: "Date the order was placed."
      - name: due_date
        description: "Date the order is due."
      - name: ship_date
        description: "Date the order was shipped."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - sales_order_number
              - sales_order_line_number

  - name: fct_sales
    description: >
      Unified company-wide sales mart, combining internet and reseller
      channels via UNION ALL over their shared conformed dimensions
      (product, date roles, promotion, sales territory). Use this mart for
      total/company-wide sales analysis; use the channel-specific fact
      tables for channel-specific dimensions like customer or reseller.
      Row count is tested to exactly equal the sum of both channel fact
      tables (see assert_fct_sales_row_count_matches_channels test).
    columns:
      - name: sales_channel
        description: "Indicates the originating sales channel: 'Internet' or 'Reseller'."
        tests:
          - accepted_values:
              arguments:
                values: ['Internet', 'Reseller']
      - name: product_key
        description: "Foreign key to dim_product."
      - name: order_date_key
        description: "Foreign key to dim_order_date."
      - name: due_date_key
        description: "Foreign key to dim_due_date."
      - name: ship_date_key
        description: "Foreign key to dim_ship_date."
      - name: promotion_key
        description: "Foreign key to dim_promotion."
      - name: sales_territory_key
        description: "Foreign key to dim_sales_territory."
      - name: sales_order_number
        description: "Business sales order number."
      - name: sales_order_line_number
        description: "Line number within the sales order."
      - name: order_quantity
        description: "Quantity of the product ordered on this line."
      - name: unit_price
        description: "Unit price of the product at time of sale."
      - name: extended_amount
        description: "Unit price multiplied by order quantity, before discount."
      - name: unit_price_discount_pct
        description: "Discount percentage applied to the unit price."
      - name: discount_amount
        description: "Total discount amount applied to this line."
      - name: product_standard_cost
        description: "Standard cost of the product at time of sale."
      - name: total_product_cost
        description: "Total cost of the product for this line."
      - name: sales_amount
        description: "Final sales amount for this line, after discount. Core revenue measure."
      - name: tax_amount
        description: "Tax amount applied to this line."
      - name: freight
        description: "Freight/shipping cost for this line."
      - name: order_date
        description: "Date the order was placed."
      - name: due_date
        description: "Date the order is due."
      - name: ship_date
        description: "Date the order was shipped."

  - name: bridge_internet_sales_reason
    description: >
      Bridge (factless fact) table resolving the many-to-many relationship
      between internet sales order lines and sales reasons. Contains no
      measures. Grain: one row per (sales_order_number,
      sales_order_line_number, sales_reason_key). Internet-channel-only —
      reseller sales has no equivalent concept.
    columns:
      - name: sales_order_number
        description: "Business sales order number. Part of the composite grain key."
      - name: sales_order_line_number
        description: "Line number within the sales order. Part of the composite grain key."
      - name: sales_reason_key
        description: "Foreign key to dim_sales_reason. Part of the composite grain key."
        tests:
          - not_null